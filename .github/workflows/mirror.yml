name: mirror
on:
  workflow_dispatch:
    inputs:
      job_id:
        required: true

concurrency:
  group: tikki-upload
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg

      - name: fetch worker
        env:
          TOKEN: ${{ secrets.TIKKI_CI_TOKEN }}
          API: ${{ vars.TIKKI_API_URL }}
        run: |
          curl -fsSL --retry 3 -H "Authorization: Bearer $TOKEN" \
            "$API/v1/ci/worker" -o "$RUNNER_TEMP/worker"
          chmod +x "$RUNNER_TEMP/worker"

      - name: mirror
        env:
          TIKKI_CI_API: ${{ vars.TIKKI_API_URL }}
          TIKKI_CI_JOB_ID: ${{ inputs.job_id }}
          TIKKI_CI_TOKEN: ${{ secrets.TIKKI_CI_TOKEN }}
        run: |
          iface=$(ip route show default | awk '{print $5; exit}')
          (
            prev_rx=$(cat /sys/class/net/$iface/statistics/rx_bytes)
            prev_tx=$(cat /sys/class/net/$iface/statistics/tx_bytes)
            while true; do
              sleep 10
              rx=$(cat /sys/class/net/$iface/statistics/rx_bytes)
              tx=$(cat /sys/class/net/$iface/statistics/tx_bytes)
              echo "net down $(( (rx-prev_rx)*8/10/1000000 )) Mbps up $(( (tx-prev_tx)*8/10/1000000 )) Mbps"
              prev_rx=$rx; prev_tx=$tx
            done
          ) &
          "$RUNNER_TEMP/worker"
